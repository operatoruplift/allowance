name: Verify Allowance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The suite is deterministic: no operator credentials, no RPC, no model
      # calls and no paid requests are reachable from CI.
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `check` is the repository's own gate: lint, typecheck, unit tests, build.
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build:rehearsal
      - run: npm run test:hosted
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
      - run: docker build -t allowance:verify .
      - name: Verify native modules, restricted runtime and durable restart
        run: node scripts/verify-container.mjs allowance:verify > container-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-container-verification
          path: container-verification.json
          retention-days: 14
